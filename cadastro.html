<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cadastro</title>
<style>
body{
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f5f5f5;
}
.box{
background:white;
padding:30px;
border-radius:10px;
width:350px;
box-shadow:0 0 10px #ccc;
}
input,button{
width:100%;
padding:10px;
margin:10px 0;
}
button{
background:red;
color:white;
border:none;
}
</style>
</head>
<body>

<div class="box">
<h2>Cadastro</h2>

<form action="home.html">
<input type="text" placeholder="Nome" required>
<input type="email" placeholder="E-mail" required>
<input type="password" placeholder="Senha" required>
<button>Cadastrar</button>
</form>

</div>

</body>
</html>
